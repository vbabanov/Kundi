name: Release Readiness Gates

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "mobile/**"
      - ".github/workflows/android-apk-build.yml"
  pull_request:
    paths:
      - "backend/**"
      - "mobile/**"
      - ".github/workflows/android-apk-build.yml"

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        run: go test ./...

  mobile-test:
    name: Flutter tests and analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.4"
          cache: true

      - name: Precache Flutter Linux test artifacts
        run: flutter precache --force --linux --universal

      - name: Normalize Roboto test font path
        run: |
          task_font_dir="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts"
          task_font_path="$(find "$task_font_dir" -maxdepth 1 -type f -iname 'roboto-regular.ttf' -print -quit)"
          test -n "$task_font_path"
          if [ "$task_font_path" != "$task_font_dir/roboto-regular.ttf" ]; then
            ln -sf "$(basename "$task_font_path")" "$task_font_dir/roboto-regular.ttf"
          fi
          test -f "$task_font_dir/roboto-regular.ttf"

      - name: Pub get
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --concurrency=1

      - name: Analyze without failing on baseline warnings
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  android-off-build:
    name: Android OFF debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # User-home properties override the project defaults for this CI process.
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci
      ENABLE_KUNDI_TTS: "false"
      ENABLE_KUNDI_VOICE_INPUT: "false"
      ENABLE_KUNDI_HOME_REALTIME_AVATAR: "false"
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.4"
          cache: true

      - name: Configure Gradle CI memory
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          printf '%s\n' \
            'org.gradle.jvmargs=-Xms256m -Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Dfile.encoding=UTF-8' \
            'org.gradle.daemon=false' \
            'org.gradle.workers.max=1' \
            'kotlin.daemon.jvmargs=-Xmx512m' \
            > "$GRADLE_USER_HOME/gradle.properties"

      - name: Pub get
        run: flutter pub get

      - name: Build staging debug APK with all Phase 2B flags off
        run: |
          set -o pipefail
          flutter build apk --debug --target-platform android-arm64 \
            --dart-define-from-file=env/dart_define.staging.example.json \
            --dart-define=ENABLE_KUNDI_TTS=false \
            --dart-define=ENABLE_KUNDI_HOME_REALTIME_AVATAR=false \
            2>&1 | tee "$RUNNER_TEMP/android-off-build.log"

      - name: Collect Gradle failure diagnostics
        if: failure()
        run: |
          task_diagnostics="$RUNNER_TEMP/gradle-diagnostics"
          mkdir -p "$task_diagnostics"
          cp "$RUNNER_TEMP/android-off-build.log" "$task_diagnostics/" 2>/dev/null || true
          find android "$GRADLE_USER_HOME" -type f -name 'hs_err_pid*.log' -exec cp {} "$task_diagnostics/" \; 2>/dev/null || true
          ./android/gradlew --version > "$task_diagnostics/gradle-version.txt" 2>&1 || true

      - name: Upload Gradle failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-off-gradle-diagnostics
          path: ${{ runner.temp }}/gradle-diagnostics
          if-no-files-found: warn

      - name: Upload OFF APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kundi-android-off-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  android-tts-compile:
    name: Android TTS compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # User-home properties override the project defaults for this CI process.
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci
      ENABLE_KUNDI_TTS: "true"
      ENABLE_KUNDI_VOICE_INPUT: "true"
      ENABLE_KUNDI_HOME_REALTIME_AVATAR: "false"
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.4"
          cache: true

      - name: Configure Gradle CI memory
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          printf '%s\n' \
            'org.gradle.jvmargs=-Xms256m -Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Dfile.encoding=UTF-8' \
            'org.gradle.daemon=false' \
            'org.gradle.workers.max=1' \
            'kotlin.daemon.jvmargs=-Xmx512m' \
            > "$GRADLE_USER_HOME/gradle.properties"

      - name: Pub get
        run: flutter pub get

      - name: Compile Android TTS source without Azure credentials
        run: |
          set -o pipefail
          flutter build apk --debug --target-platform android-arm64 \
            --dart-define=ENABLE_KUNDI_ASSISTANT=true \
            --dart-define=ENABLE_KUNDI_VOICE_INPUT=true \
            --dart-define=ENABLE_KUNDI_TTS=true \
            --dart-define=ENABLE_KUNDI_HOME_REALTIME_AVATAR=false \
            2>&1 | tee "$RUNNER_TEMP/android-tts-compile.log"

      - name: Collect Gradle failure diagnostics
        if: failure()
        run: |
          task_diagnostics="$RUNNER_TEMP/gradle-diagnostics"
          mkdir -p "$task_diagnostics"
          cp "$RUNNER_TEMP/android-tts-compile.log" "$task_diagnostics/" 2>/dev/null || true
          find android "$GRADLE_USER_HOME" -type f -name 'hs_err_pid*.log' -exec cp {} "$task_diagnostics/" \; 2>/dev/null || true
          ./android/gradlew --version > "$task_diagnostics/gradle-version.txt" 2>&1 || true

      - name: Upload Gradle failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-tts-gradle-diagnostics
          path: ${{ runner.temp }}/gradle-diagnostics
          if-no-files-found: warn

  android-unsigned-release:
    name: Android unsigned release AAB and signing policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci
      ENABLE_KUNDI_TTS: "false"
      ENABLE_KUNDI_VOICE_INPUT: "false"
      ENABLE_KUNDI_HOME_REALTIME_AVATAR: "false"
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.4"
          cache: true

      - name: Configure Gradle CI memory
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          printf '%s\n' \
            'org.gradle.jvmargs=-Xms256m -Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Dfile.encoding=UTF-8' \
            'org.gradle.daemon=false' \
            'org.gradle.workers.max=1' \
            'kotlin.daemon.jvmargs=-Xmx512m' \
            > "$GRADLE_USER_HOME/gradle.properties"

      - name: Pub get
        run: flutter pub get

      - name: Verify release signing policy
        run: bash android/gradlew -p android :app:verifyReleaseSigningPolicy

      - name: Build unsigned release AAB
        run: |
          flutter build appbundle --release --target-platform android-arm64 \
            --dart-define=KUNDI_CRASH_REPORTING_ENABLED=false \
            --dart-define=ENABLE_KUNDI_TTS=false \
            --dart-define=ENABLE_KUNDI_HOME_REALTIME_AVATAR=false

      - name: Verify artifact is not signed with a configured identity
        run: |
          test -f build/app/outputs/bundle/release/app-release.aab
          ! bash android/gradlew -p android :app:verifyProductionSigningConfiguration

      - name: Upload explicitly unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: kundi-android-unsigned-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
