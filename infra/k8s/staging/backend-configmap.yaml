apiVersion: v1
kind: ConfigMap
metadata:
  name: kundi-backend-config
  namespace: kundi-staging
data:
  APP_NAME: "kundi-backend"
  APP_ENV: "staging"
  APP_PORT: "8080"
  LOG_LEVEL: "info"
  HTTP_READ_TIMEOUT_SEC: "20"
  HTTP_WRITE_TIMEOUT_SEC: "40"
  DATABASE_URL: "postgres://kundi:replace-postgres-password@postgres:5432/kundi?sslmode=disable"
  DB_AUTO_MIGRATE: "false"
  OBJECT_STORAGE_PROVIDER: "s3"
  OBJECT_STORAGE_ENDPOINT: "http://minio:9000"
  OBJECT_STORAGE_BUCKET: "kundi-staging"
  OBJECT_STORAGE_PUBLIC_BASE_URL: ""
  AI_WORKER_CONCURRENCY: "4"
  AI_LLM_PROVIDER: "deterministic"
  AI_LLM_BASE_URL: ""
  AI_TTS_PROVIDER: "deterministic"
  AI_TTS_BASE_URL: "https://cdn.kundi.local"
  WHATSAPP_WORKER_CONCURRENCY: "2"
  WHATSAPP_PROVIDER: "deterministic"
  WHATSAPP_BASE_URL: ""
  JOBS_LEASE_SEC: "45"
  JOBS_POLL_MS: "800"
