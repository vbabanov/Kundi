apiVersion: v1
kind: Secret
metadata:
  name: kundi-backend-secrets
  namespace: kundi-staging
type: Opaque
stringData:
  ACCESS_TOKEN_SECRET: "replace-with-long-random-secret"
  FIELD_ENCRYPTION_KEY: "replace-with-exactly-32-byte-key"
  OBJECT_STORAGE_ACCESS_KEY: "replace-minio-access-key"
  OBJECT_STORAGE_SECRET_KEY: "replace-minio-secret-key"
  AI_LLM_API_KEY: "replace-llm-key-or-empty-for-deterministic"
  AI_TTS_API_KEY: "replace-tts-key-or-empty-for-deterministic"
  WHATSAPP_API_TOKEN: "replace-whatsapp-token-or-empty-for-deterministic"
