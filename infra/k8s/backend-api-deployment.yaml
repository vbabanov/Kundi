apiVersion: apps/v1
kind: Deployment
metadata:
  name: kundi-backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kundi-backend-api
  template:
    metadata:
      labels:
        app: kundi-backend-api
    spec:
      containers:
        - name: api
          image: ghcr.io/kundi/backend-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_PORT
              value: "8080"
            - name: APP_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: kundi-backend-api
spec:
  selector:
    app: kundi-backend-api
  ports:
    - port: 80
      targetPort: 8080
